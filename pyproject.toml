[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-htmx"
dynamic = ["version"]
description = "Django's default admin with HTMX 4 navigation and managed widget lifecycles"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE", "src/admin_htmx/static/admin_htmx/vendor/HTMX-LICENSE"]
authors = [{name = "django-admin-htmx contributors"}]
dependencies = ["Django>=5.2,<6.2"]
keywords = ["django", "admin", "htmx", "progressive-enhancement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Framework :: Django", "Framework :: Django :: 5.2", "Framework :: Django :: 6.0", "Framework :: Django :: 6.1",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hitenjadeja/django-admin-htmx"
Documentation = "https://github.com/hitenjadeja/django-admin-htmx#readme"
Repository = "https://github.com/hitenjadeja/django-admin-htmx"
Issues = "https://github.com/hitenjadeja/django-admin-htmx/issues"
Changelog = "https://github.com/hitenjadeja/django-admin-htmx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-cov>=7,<8", "playwright>=1.51", "beautifulsoup4>=4.12", "build>=1.2"]
dev = [
  "build>=1.2",
  "twine>=6.1",
  "uv>=0.8",
  "pre-commit>=4.6,<5",
  # Keep these versions aligned with .pre-commit-config.yaml.
  "ruff==0.16.7",
  "ty==0.0.80",
  "django-stubs>=6.1,<6.2",
]

[tool.setuptools.dynamic]
version = {attr = "admin_htmx.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admin_htmx = ["templates/**/*.html", "static/**/*", "py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: real Chromium browser integration tests"]

[tool.coverage.run]
source = ["admin_htmx"]
branch = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true

[tool.ruff]
target-version = "py312"
# These projects are generated by scripts/verify_fresh_install.py.
extend-exclude = ["fresh_install"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["admin_htmx", "example"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "example", "tests", "scripts"]
