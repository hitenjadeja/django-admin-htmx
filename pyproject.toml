[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-htmx"
version = "0.1.1"
description = "Django's default admin with HTMX 4 navigation and managed widget lifecycles"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{name = "django-admin-htmx contributors"}]
dependencies = ["Django>=5.2,<6.2"]
classifiers = [
  "Framework :: Django", "Framework :: Django :: 5.2", "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3", "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9", "playwright>=1.51", "beautifulsoup4>=4.12", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admin_htmx = ["templates/**/*.html", "static/**/*", "py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: real Chromium browser integration tests"]
