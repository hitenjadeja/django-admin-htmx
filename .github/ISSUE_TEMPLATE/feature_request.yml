name: Feature request
description: Suggest an improvement to the admin integration.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how this fits Django's native admin behavior and appearance.
    validations:
      required: true
