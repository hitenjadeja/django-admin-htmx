name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  lint:
    name: Ruff and ty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m pre_commit run --all-files --show-diff-on-failure

  backend:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        env:
          DJANGO_SERIES: ${{ matrix.django }}
        run: python -m pip install -e '.[test]' "Django==$DJANGO_SERIES.*"
      - run: python -m pytest -m 'not browser' -q

  browser:
    name: Chromium / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        django: ['5.2', '6.0', '6.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        env:
          DJANGO_SERIES: ${{ matrix.django }}
        run: python -m pip install -e '.[test]' "Django==$DJANGO_SERIES.*"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser -q
      - name: Save appearance comparisons on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-django-${{ matrix.django }}
          path: evidence/style-parity/
          retention-days: 3

  distribution:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      # build creates the sdist, then builds the wheel from that sdist.
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py --dist-dir dist
      - name: Validate tag against version and changelog
        if: github.ref_type == 'tag'
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  installed-wheel:
    name: Fresh wheel / Django ${{ matrix.django }}
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        django: ['5.2', '6.0', '6.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - run: python -m pip install uv playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install and exercise the built wheel in a separate project
        env:
          DJANGO_SERIES: ${{ matrix.django }}
        run: python scripts/verify_fresh_install.py --skip-build --series "$DJANGO_SERIES"

  success:
    name: CI success
    if: always()
    needs: [lint, backend, browser, distribution, installed-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert results and all(r == "success" for r in results), results'
